<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players | Intelligence System</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1a1a1a;
            padding: 2rem;
            border-radius: 8px;
            width: 400px;
            border: 1px solid #00E5FF;
        }
        .modal-content h2 { margin-top: 0; color: #00E5FF; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #ccc; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.5rem;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">PLAYER REPOSITORY</div>
        <button class="btn btn-primary" onclick="history.back()">Back</button>
    </nav>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; gap: 2rem; flex-wrap: wrap;">
            <h1>National Player Registry</h1>
            <div style="flex: 1; min-width: 300px; position: relative;">
                <input type="text" id="playerSearch" class="btn-glass" placeholder="🔍 Search players by name, ID, or position..." 
                       style="width: 100%; padding: 12px 20px 12px 45px; border-radius: 12px; border: 1px solid rgba(0, 229, 255, 0.3);"
                       onkeyup="filterPlayers()">
                <span style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); opacity: 0.5;">🔍</span>
            </div>
            <button class="btn btn-primary" onclick="document.getElementById('addPlayerModal').classList.add('active')">+ Register New Player</button>
        </header>
        <div class="dashboard-grid" id="player-grid">
            <!-- Dynamic Players will be loaded here -->
        </div>
    </div>

    <!-- Add Player Modal -->
    <div class="modal" id="addPlayerModal">
        <div class="modal-content">
            <h2>Register New Player</h2>
            <div class="form-group">
                <label>Player Name</label>
                <input type="text" id="playerName" placeholder="e.g. John Doe">
            </div>
            <div class="form-group">
                <label>Position</label>
                <select id="playerPosition">
                    <option value="GK">Goalkeeper (GK)</option>
                    <option value="DF">Defender (DF)</option>
                    <option value="MF">Midfielder (MF)</option>
                    <option value="FW">Forward (FW)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Institution ID</label>
                <input type="number" id="playerInstitution" value="1">
            </div>
            <div class="modal-actions">
                <button class="btn" style="background:#444;" onclick="document.getElementById('addPlayerModal').classList.remove('active')">Cancel</button>
                <button class="btn btn-primary" onclick="submitPlayer()">Register</button>
            </div>
        </div>
    </div>

    <!-- Edit Player Modal -->
    <div class="modal" id="editPlayerModal">
        <div class="modal-content">
            <h2>Edit Player Details</h2>
            <input type="hidden" id="editPlayerId">
            <div class="form-group">
                <label>Player Name</label>
                <input type="text" id="editPlayerName">
            </div>
            <div class="form-group">
                <label>Position</label>
                <select id="editPlayerPosition">
                    <option value="GK">Goalkeeper (GK)</option>
                    <option value="DF">Defender (DF)</option>
                    <option value="MF">Midfielder (MF)</option>
                    <option value="FW">Forward (FW)</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn" style="background:#444;" onclick="document.getElementById('editPlayerModal').classList.remove('active')">Cancel</button>
                <button class="btn btn-primary" onclick="updatePlayer()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8001/api';
        let allPlayers = [];

        async function fetchPlayers() {
            try {
                const res = await secureFetch(`${API_URL}/players/`);
                if (res.ok) {
                    allPlayers = await res.json();
                    renderPlayers(allPlayers);
                }
            } catch (err) {
                console.error("Failed to load players", err);
            }
        }

        function filterPlayers() {
            const query = document.getElementById('playerSearch').value.toLowerCase();
            const filtered = allPlayers.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.position.toLowerCase().includes(query) || 
                (p.player_code && p.player_code.toLowerCase().includes(query)) ||
                p.id.toString().includes(query)
            );
            renderPlayers(filtered);
        }

        function renderPlayers(players) {
            const grid = document.getElementById('player-grid');
            grid.innerHTML = '';
            players.forEach(p => {
                grid.innerHTML += `
                    <div class="card glass">
                        <div style="display:flex; justify-content:space-between; align-items:start;">
                            <h4>${p.name}</h4>
                            <span style="font-size:0.7rem; color:#00E5FF; border:1px solid #00E5FF; padding:2px 4px; border-radius:4px;">${p.position}</span>
                        </div>
                        <p style="font-size:0.8rem; color:#888; margin:0.5rem 0;">ID: ${p.player_code || p.id}</p>
                        
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem; margin-top:1rem;">
                            <button class="btn btn-primary" onclick="viewProfile(${p.id})">DNA</button>
                            <button class="btn" style="background:#2a2a2a; border:1px solid #444;" onclick="openEditModal(${p.id}, '${p.name}', '${p.position}')">Edit</button>
                        </div>
                        <button class="btn" style="background:#331111; color:#ff4444; width:100%; margin-top:0.5rem; font-size:0.8rem;" onclick="deletePlayer(${p.id})">Release Player</button>
                    </div>
                `;
            });
        }

        function viewProfile(id) {
            alert("Redirecting to Player DNA profile for ID: " + id);
        }

        function openEditModal(id, name, position) {
            document.getElementById('editPlayerId').value = id;
            document.getElementById('editPlayerName').value = name;
            document.getElementById('editPlayerPosition').value = position;
            document.getElementById('editPlayerModal').classList.add('active');
        }

        async function updatePlayer() {
            const id = document.getElementById('editPlayerId').value;
            const name = document.getElementById('editPlayerName').value;
            const position = document.getElementById('editPlayerPosition').value;

            try {
                const res = await fetch(`${API_URL}/players/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, position })
                });

                if (res.ok) {
                    document.getElementById('editPlayerModal').classList.remove('active');
                    fetchPlayers();
                } else {
                    alert("Error updating player");
                }
            } catch (err) {
                console.error(err);
                alert("Failed to update");
            }
        }

        async function deletePlayer(id) {
            if (!confirm("Are you sure you want to release this player? This action is permanent in the national ledger.")) return;

            try {
                const res = await fetch(`${API_URL}/players/${id}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    fetchPlayers();
                } else {
                    alert("Error deleting player");
                }
            } catch (err) {
                console.error(err);
                alert("Failed to delete");
            }
        }

        async function submitPlayer() {
            const name = document.getElementById('playerName').value;
            const position = document.getElementById('playerPosition').value;
            const institution_id = parseInt(document.getElementById('playerInstitution').value);

            if (!name) return alert("Please enter player name");

            try {
                const res = await fetch(`${API_URL}/players/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, position, institution_id })
                });

                if (res.ok) {
                    document.getElementById('addPlayerModal').classList.remove('active');
                    document.getElementById('playerName').value = '';
                    fetchPlayers();
                } else {
                    alert("Error registering player");
                }
            } catch (err) {
                console.error(err);
                alert("Failed to submit");
            }
        }

        // Initial load
        fetchPlayers();
    </script>
</body>
</html>
