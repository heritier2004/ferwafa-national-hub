<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Football Intelligence | Command Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --primary: #6366f1;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }

        .login-card {
            width: 450px;
            background: #09090b;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 4rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header { text-align: center; margin-bottom: 3rem; }
        .header h1 { font-size: 1.75rem; font-weight: 900; letter-spacing: -0.025em; text-transform: uppercase; color: var(--text-main); }
        .header h1 span { color: var(--primary); }
        .header p { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.5rem; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700; }

        .group { margin-bottom: 2rem; }
        .group label { display: block; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; }
        .field { width: 100%; padding: 1.25rem; background: #000; border: 1px solid var(--border); border-radius: 12px; color: #FFF; font-family: inherit; font-size: 1rem; transition: 0.2s; }
        .field:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }

        .btn { 
            width: 100%; padding: 1.25rem; border-radius: 12px; border: none; 
            background: linear-gradient(135deg, var(--primary), #4f46e5); color: #FFF; font-weight: 900; 
            text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; 
            transition: all 0.3s; font-size: 0.85rem;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4); }

        .error { color: #EF4444; font-size: 0.8rem; text-align: center; margin-top: 1.5rem; display: none; font-weight: 700; }

        .footer { text-align: center; margin-top: 3rem; font-size: 0.65rem; color: var(--text-dim); letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header">
            <h1>Command <span>Portal</span></h1>
            <p>Authorization Required</p>
        </div>

        <form id="login-form">
            <div class="group">
                <label>Identity Email</label>
                <input type="email" id="email" class="field" placeholder="name@ferwafa.rw" required>
            </div>
            <div class="group">
                <label>Access Password</label>
                <input type="password" id="password" class="field" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Authorize Access</button>
            <div id="error" class="error">INVALID CREDENTIALS</div>
        </form>

        <div class="footer">
            Secure National Intelligence Gateway
        </div>
    </div>

    <script>
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const error = document.getElementById('error');
            error.style.display = 'none';

            const formData = new FormData();
            formData.append('username', email);
            formData.append('password', password);

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('full_name', data.full_name);
                    localStorage.setItem('institution_id', data.institution_id || '');
                    localStorage.setItem('stadium_name', data.stadium_name || '');
                    localStorage.setItem('logo_url', data.logo_url || '');
                    localStorage.setItem('institution_name', data.institution_name || '');

                    // Role-based Routing
                    if (data.role === 'SUPER_ADMIN') window.location.href = '/pages/dashboards/super_admin.html';
                    else if (data.role === 'FERWAFA') window.location.href = '/pages/dashboards/ferwafa.html';
                    else if (data.role === 'CLUB') window.location.href = '/pages/dashboards/club.html';
                    else if (data.role === 'SCHOOL') window.location.href = '/pages/dashboards/school.html';
                    else if (data.role === 'ACADEMY') window.location.href = '/pages/dashboards/academy.html';
                    else if (data.role === 'SCOUT') window.location.href = '/pages/dashboards/scout.html';
                } else {
                    error.style.display = 'block';
                }
            } catch (err) {
                error.style.display = 'block';
                error.innerText = "CONNECTION FAILED";
            }
        };
    </script>
</body>
</html>
