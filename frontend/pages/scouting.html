<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scouting Hub | Intelligence System</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .star-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--secondary);
            font-size: 1.2rem;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">TALENT HUB</div>
        <div style="color: var(--primary)">FERWAFA SCOUTING NODE</div>
    </nav>
    <div class="container">
        <h1>AI-Powered Talent Discovery</h1>
        <p style="color: var(--text-dim); margin-bottom: 2rem;">Recommendations based on real-time match intelligence tracking.</p>

        <div style="margin-bottom: 2rem; position: relative;">
            <input type="text" id="scoutSearch" class="btn-glass" placeholder="🔍 Search top prospects by name..." 
                   style="width: 100%; padding: 15px 20px 15px 50px; border-radius: 15px; border: 1px solid rgba(0, 229, 255, 0.3);"
                   onkeyup="filterScouting()">
            <span style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 1.2rem;">🔍</span>
        </div>

        <div class="dashboard-grid" id="recommendations-list">
            <!-- Loading indicator -->
            <p style="color:var(--text-dim);">Scanning national database for top talent...</p>
        </div>
    </div>

    <script src="../assets/js/app.js"></script>
    <script>
        let scoutPlayers = [];

        async function loadRecommendations() {
            const list = document.getElementById('recommendations-list');
            try {
                const res = await fetch('/api/scouting/recommendations?min_rating=6.5');
                scoutPlayers = await res.json();
                renderScouting(scoutPlayers);
            } catch (e) {
                list.innerHTML = '<p style="color:var(--accent)">Failed to initialize scouting stream.</p>';
            }
        }

        function filterScouting() {
            const query = document.getElementById('scoutSearch').value.toLowerCase();
            const filtered = scoutPlayers.filter(p => p.player.toLowerCase().includes(query));
            renderScouting(filtered);
        }

        function renderScouting(players) {
            const list = document.getElementById('recommendations-list');
            if (players.length === 0) {
                list.innerHTML = '<p style="color:var(--text-dim)">No matching prospects found.</p>';
                return;
            }

            list.innerHTML = players.map(p => `
                <div class="card glass">
                    <div class="star-box">${p.rating.toFixed(1)} ★</div>
                    <h3>AI Recommendation</h3>
                    <p><strong>${p.player}</strong></p>
                    <p style="font-size:0.85rem; color:var(--text-dim); margin-top:0.5rem;">Verified Potential: ${p.rating > 8.5 ? 'Elite' : 'High'}</p>
                    <button class="btn btn-primary" style="margin-top: 1rem; width:100%" onclick="alert('Scout report for ${p.player} is being generated...')">Download Report</button>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', loadRecommendations);
    </script>
</body>
</html>
