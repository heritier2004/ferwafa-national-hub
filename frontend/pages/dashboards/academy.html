<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Academy Hub | Football Intelligence Platform</title>
    <link rel="stylesheet" href="../../assets/css/style.css?v=2.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-academy">
    <div class="app-container">
        
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">ACADEMY<span>HUB</span></div>
                <div style="font-size: 0.65rem; color: var(--accent-secondary); font-weight: 800; letter-spacing: 0.1em; margin-top: 5px;">PROSPECT PIPELINE</div>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-item active" onclick="showTab('overview')">
                    <i class="fa-solid fa-gauge-high"></i>
                    <span>Prospect Intelligence</span>
                </div>
                <div class="nav-item" onclick="showTab('players')">
                    <i class="fa-solid fa-users"></i>
                    <span>Academy Registry</span>
                </div>
                <div class="nav-item" onclick="showTab('match-control')">
                    <i class="fa-solid fa-gamepad"></i>
                    <span>Match Operations</span>
                </div>
                <div class="nav-item" onclick="showTab('settings')">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </div>
            </nav>
            
            <div style="padding: 2rem;">
                <button class="btn btn-outline" style="width: 100%; border-color: var(--danger); color: var(--danger);" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main-content">
            <header class="topbar">
                <div style="font-weight: 800; letter-spacing: 0.1em;" id="page-title">PROSPECT INTELLIGENCE</div>
                <div style="display: flex; gap: 1.5rem; align-items: center;">
                    <span id="inst-name" style="font-size: 0.8rem; font-weight: 800; color: var(--text-secondary);">LOADING...</span>
                    <button class="btn btn-primary" onclick="window.location.href='../players/add_player.html'"><i class="fa-solid fa-plus"></i> NEW PROSPECT</button>
                </div>
            </header>

            <div class="main-stage" id="main-stage">
                
                <!-- OVERVIEW -->
                <section id="overview" class="tab-pane active">
                    <span class="section-tag">Academy Performance Terminal</span>
                    <div class="dashboard-grid">
                        <div class="card">
                            <div style="color: var(--text-secondary); font-size: 0.75rem; font-weight: 800; margin-bottom: 1rem;">ELITE PROSPECTS</div>
                            <div class="stat-value" id="total-prospects">--</div>
                        </div>
                        <div class="card">
                            <div style="color: var(--text-secondary); font-size: 0.75rem; font-weight: 800; margin-bottom: 1rem;">SCOUTING VISIBILITY</div>
                            <div class="stat-value" style="color: var(--success);">HIGH</div>
                        </div>
                        <div class="card">
                            <div style="color: var(--text-secondary); font-size: 0.75rem; font-weight: 800; margin-bottom: 1rem;">AI TRAJECTORY</div>
                            <div class="stat-value" style="color: var(--accent-primary);">OPTIMAL</div>
                        </div>
                    </div>
                </section>

                <!-- PLAYERS -->
                <section id="players" class="tab-pane">
                    <span class="section-tag">Academy Prospect Registry</span>
                    <div id="player-grid" class="dashboard-grid">
                        <!-- Loaded via JS -->
                    </div>
                </section>

                <!-- MATCH CONTROL -->
                <section id="match-control" class="tab-pane" style="height: 100%; padding: 0;">
                    <iframe id="mcc-iframe" src="about:blank" style="width: 100%; height: 100%; border: none;"></iframe>
                </section>

            </div>
        </main>

    </div>

    <script>
        const inst_id = localStorage.getItem('institution_id');
        document.getElementById('inst-name').innerText = localStorage.getItem('institution_name') || 'AUTHORIZED ACADEMY';

        function showTab(tabId) {
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            document.getElementById('page-title').innerText = tabId.replace('-', ' ').toUpperCase();
            
            const stage = document.getElementById('main-stage');
            if (tabId === 'match-control') {
                stage.style.padding = '0';
                initializeMatch();
            } else {
                stage.style.padding = '3rem';
            }

            if (tabId === 'players') loadPlayers();
        }

        async function initializeMatch() {
            const iframe = document.getElementById('mcc-iframe');
            if (iframe.src !== 'about:blank') return;
            
            try {
                const r = await fetch(`/api/matches/initialize/${inst_id}`, { method: 'POST' });
                const d = await r.json();
                if (d.match_id) {
                    iframe.src = `../match/match_control.html?match_id=${d.match_id}&v=2.0`;
                }
            } catch (e) { console.error("MCC Init Failed", e); }
        }

        async function loadPlayers() {
            const grid = document.getElementById('player-grid');
            const token = localStorage.getItem('access_token');
            try {
                const r = await fetch(`/api/academy/players/${inst_id}`, { headers: {'Authorization': `Bearer ${token}`} });
                const players = await r.json();
                grid.innerHTML = players.map(p => `
                    <div class="card" style="text-align: center; padding: 2rem;">
                        <img src="${p.photo_url || '../../assets/img/default-player.png'}" style="width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--accent-primary); margin-bottom: 1.5rem; object-fit: cover;">
                        <div style="font-weight: 800; font-size: 1rem;">${p.name}</div>
                        <div style="color: var(--text-secondary); font-size: 0.7rem; font-weight: 800; margin-top: 0.5rem;">${p.player_code}</div>
                    </div>
                `).join('');
            } catch (e) {}
        }

        function logout() { localStorage.clear(); window.location.href = '/login.html'; }

        showTab('overview');
    </script>
</body>
</html>
