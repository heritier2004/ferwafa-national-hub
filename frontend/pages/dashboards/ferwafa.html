<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Hub | Federation Authority</title>
    <link rel="stylesheet" href="../../assets/css/style.css?v=2.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .badge-ferwafa { background: rgba(59, 130, 246, 0.1); color: var(--accent-primary); border: 1px solid var(--accent-primary); }
    </style>
</head>
<body class="theme-ferwafa">
    <div class="app-container">
        
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">NATIONAL<span>HUB</span></div>
                <div style="font-size: 0.6rem; color: var(--accent-primary); font-weight: 800; letter-spacing: 0.2em; margin-top: 5px; text-transform: uppercase;">Federation Authority</div>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-item active" onclick="showPane('overview')">
                    <i class="fa-solid fa-tower-observation"></i>
                    <span>National Overview</span>
                </div>
                <div class="nav-item" onclick="showPane('institutions')">
                    <i class="fa-solid fa-building-shield"></i>
                    <span>Institutions</span>
                </div>
                <div class="nav-item" onclick="showPane('matches')">
                    <i class="fa-solid fa-satellite"></i>
                    <span>Match Monitoring</span>
                </div>
                <div class="nav-item" onclick="showPane('talent')">
                    <i class="fa-solid fa-dna"></i>
                    <span>Talent Registry</span>
                </div>
                <div class="nav-item" onclick="showPane('reports')">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>National Reports</span>
                </div>
                <div class="nav-item" onclick="showPane('forensics')">
                    <i class="fa-solid fa-fingerprint"></i>
                    <span>Audit Logs</span>
                </div>
            </nav>
            
            <div style="padding: 2rem;">
                <button class="btn btn-outline" style="width: 100%; border-color: var(--danger); color: var(--danger);" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Deauthorize</span>
                </button>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main-content">
            <header class="topbar">
                <div style="font-weight: 900; letter-spacing: 0.15em;" id="pane-title">NATIONAL OVERVIEW</div>
                <div style="display: flex; gap: 2rem; align-items: center;">
                    <span style="font-size: 0.75rem; font-weight: 800; color: var(--success);"><i class="fa-solid fa-circle" style="font-size: 0.5rem; margin-right: 8px;"></i> LIVE TELEMETRY ACTIVE</span>
                    <button class="btn btn-primary" onclick="showPane('institutions')"><i class="fa-solid fa-plus"></i> ONBOARD INSTITUTION</button>
                </div>
            </header>

            <div class="main-stage">
                
                <!-- OVERVIEW -->
                <section id="overview" class="tab-pane active">
                    <span class="section-tag">National Intelligence KPIs</span>
                    <div class="dashboard-grid">
                        <div class="card">
                            <label class="section-tag" style="margin-bottom: 0.5rem;">Registered Clubs</label>
                            <div class="stat-value">52</div>
                        </div>
                        <div class="card">
                            <label class="section-tag" style="margin-bottom: 0.5rem;">Academy Hubs</label>
                            <div class="stat-value">124</div>
                        </div>
                        <div class="card">
                            <label class="section-tag" style="margin-bottom: 0.5rem;">Active Players</label>
                            <div class="stat-value" id="total-players">4,281</div>
                        </div>
                        <div class="card">
                            <label class="section-tag" style="margin-bottom: 0.5rem;">Live Matches</label>
                            <div class="stat-value" style="color: var(--accent-secondary);">08</div>
                        </div>
                    </div>

                    <div style="margin-top: 3rem;">
                        <span class="section-tag">Active National Operations</span>
                        <div class="card" style="padding: 0; overflow: hidden;">
                            <table style="width: 100%; border-collapse: collapse;">
                                <thead style="background: var(--bg-tertiary);">
                                    <tr>
                                        <th style="padding: 1.5rem; text-align: left; font-size: 0.7rem; font-weight: 800; color: var(--text-secondary);">INSTITUTION</th>
                                        <th style="padding: 1.5rem; text-align: left; font-size: 0.7rem; font-weight: 800; color: var(--text-secondary);">LOCATION</th>
                                        <th style="padding: 1.5rem; text-align: left; font-size: 0.7rem; font-weight: 800; color: var(--text-secondary);">STATUS</th>
                                        <th style="padding: 1.5rem; text-align: left; font-size: 0.7rem; font-weight: 800; color: var(--text-secondary);">ACTION</th>
                                    </tr>
                                </thead>
                                <tbody id="national-ops-list">
                                    <!-- Populated by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- Additional Panes ... -->

            </div>
        </main>

    </div>

    <script>
        function showPane(paneId) {
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            const target = document.getElementById(paneId);
            if (target) {
                target.classList.add('active');
                document.getElementById('pane-title').innerText = paneId.replace('-', ' ').toUpperCase();
                document.querySelector(`.nav-item[onclick*="${paneId}"]`).classList.add('active');
            }
        }

        async function loadOverview() {
            // Load national stats
        }

        function logout() { localStorage.clear(); window.location.href = '/login.html'; }

        showPane('overview');
    </script>
</body>
</html>
